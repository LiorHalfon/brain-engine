<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Graph</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f3f3f1;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --border: #deddd8;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --edge: #c4c3bd;
    --edge-history: #e2e1dc;
    --dim: #ebeae6;
    --accent: #2a78d6;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-other: #b5b4ae;
    --selection: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --border: #3a3a37;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e88;
      --edge: #5a5955;
      --edge-history: #3b3b37;
      --dim: #2a2a28;
      --accent: #3987e5;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-other: #6b6a65;
      --selection: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --border: #3a3a37;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e88;
    --edge: #5a5955;
    --edge-history: #3b3b37;
    --dim: #2a2a28;
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-other: #6b6a65;
    --selection: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    overflow: hidden;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .meta { color: var(--text-muted); }
  header .spacer { flex: 1; }
  input[type="search"], select {
    max-width: 100%; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font: inherit;
  }
  input[type="search"] { width: 240px; }
  select { padding: 3px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; max-width: 320px; }
  button, label.toggle {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    font: inherit; cursor: pointer;
  }
  button:hover, label.toggle:hover { border-color: var(--text-muted); }
  .overview {
    display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; max-height: 30vh; overflow-y: auto;
    padding: 8px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  }
  .overview .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .overview .group-title { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
    font-size: 12px; cursor: pointer; user-select: none;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .chip.rel { border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; cursor: default; }
  .chip.active { border-color: var(--selection); box-shadow: inset 0 0 0 1px var(--selection); }
  .chip .count { color: var(--text-muted); }
  main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  #canvas { position: relative; min-width: 0; min-height: 0; background: var(--surface-1); }
  aside {
    border-left: 1px solid var(--border); background: var(--surface-2); overflow: auto; padding: 14px 16px;
  }
  aside h2 { font-size: 13px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  aside h3 { font-size: 12px; margin: 16px 0 6px; display: flex; gap: 6px; align-items: center; }
  aside .empty { color: var(--text-muted); }
  aside table { width: 100%; border-collapse: collapse; }
  aside td { padding: 6px 0; border-top: 1px solid var(--border); vertical-align: top; }
  aside td.key { width: 92px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding-right: 8px; }
  aside td.value { word-break: break-word; }
  aside .clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  aside .source { display: block; margin-bottom: 4px; }
  aside .goto { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  aside .goto:hover { text-decoration: underline; }
  aside .badge { font-size: 10px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); margin-left: 4px; }
  aside .hint { margin-top: 16px; color: var(--text-muted); font-size: 12px; }
  aside .hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
  .notice { position: absolute; inset: 0 340px 0 0; display: grid; place-items: center; color: var(--text-muted); pointer-events: none; text-align: center; padding: 16px; }
  .zoom { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .zoom button { width: 30px; height: 30px; justify-content: center; padding: 0; }
  @media (max-width: 760px) {
    .overview { max-height: 96px; }
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 40%; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
    .notice { inset: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Memory Graph</h1>
  <span class="meta" id="meta">Loading…</span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="Find entity…" autocomplete="off" list="entity-names">
  <datalist id="entity-names"></datalist>
  <label class="toggle"><input type="checkbox" id="history"> Show history</label>
  <button id="reload" title="Reload from the service">Reload</button>
</header>
<div class="overview" id="overview"></div>
<main>
  <div id="canvas" role="img" aria-label="Entities and facts in the memory graph"></div>
  <div class="notice" id="notice" hidden></div>
  <div class="zoom">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-fit" aria-label="Fit to screen" title="Fit to screen">⤢</button>
  </div>
  <aside id="inspector"></aside>
</main>
<script type="module">
  // Sigma draws with WebGL and only labels the nodes that fit, so the page stays usable as the
  // graph grows. Versions are pinned; the graph data never leaves the machine.
  import Graph from "https://cdn.jsdelivr.net/npm/graphology@0.26.0/+esm";
  import Sigma from "https://cdn.jsdelivr.net/npm/sigma@3.0.3/+esm";
  import forceAtlas2 from "https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/+esm";

  // Memory kinds that get their own colour. Network layouts put every pair of colours side by
  // side, so only the first three validated categorical slots are used; the rest share a neutral.
  const KIND_SLOTS = { product: "--series-1", decision: "--series-2", person: "--series-3" };
  const LABEL_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const MONO_FONT = "ui-monospace, SFMono-Regular, Menlo, monospace";

  const container = document.getElementById("canvas");
  const state = {
    data: null, showHistory: false, query: "", focus: null, selected: null,
    hovered: null, hoveredEdge: null, relFilter: null, kindFilter: null,
  };
  // Node positions survive rebuilds (history toggle, reload) and drags.
  const positions = new Map();
  let graph = null;
  let renderer = null;
  let colors = {};
  let neighbourhood = null; // the hovered or selected node and its neighbours
  let focusSet = null;      // the double-clicked node and its neighbours
  let relNodes = null;      // nodes touching a fact of the chosen relationship

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const kindColor = (kind) => colors.kinds[kind] || colors.other;
  const fmtDate = (iso) => (iso ? iso.slice(0, 10) : "—");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shorten = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
  const countBy = (items, key) => {
    const counts = new Map();
    for (const item of items) counts.set(key(item), (counts.get(key(item)) || 0) + 1);
    return [...counts].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  };

  function readColors() {
    colors = {
      text: css("--text-primary"), textSecondary: css("--text-secondary"), surface: css("--surface-1"),
      edge: css("--edge"), edgeHistory: css("--edge-history"), dim: css("--dim"), accent: css("--accent"),
      selection: css("--selection"), other: css("--series-other"),
      kinds: Object.fromEntries(Object.entries(KIND_SLOTS).map(([kind, name]) => [kind, css(name)])),
    };
  }

  async function load() {
    document.getElementById("meta").textContent = "Loading…";
    const res = await fetch("graph.json", { cache: "no-store" });
    state.data = await res.json();
    rebuild();
  }

  function nodeKinds(data) {
    // A node's kind is the memory type that most of its facts come from.
    const tally = new Map();
    for (const e of data.edges) {
      for (const id of e.source_memory_ids) {
        const kind = data.memories[id]?.type;
        if (!kind) continue;
        for (const n of [e.source, e.target]) {
          const t = tally.get(n) || new Map();
          t.set(kind, (t.get(kind) || 0) + 1);
          tally.set(n, t);
        }
      }
    }
    const kinds = new Map();
    for (const [n, t] of tally) kinds.set(n, [...t].sort((a, b) => b[1] - a[1])[0][0]);
    return kinds;
  }

  function buildGraph(data) {
    const facts = data.edges.filter((e) => state.showHistory || e.current);
    const kinds = nodeKinds(data);
    const g = new Graph({ type: "directed" });
    // Entities with no facts at all still show; ones reachable only through hidden history do not.
    const linked = new Set(data.edges.flatMap((e) => [e.source, e.target]));
    const used = new Set(facts.flatMap((e) => [e.source, e.target]));
    for (const n of data.nodes) {
      if (linked.has(n.uuid) && !used.has(n.uuid)) continue;
      g.addNode(n.uuid, { name: n.name, summary: n.summary, kind: kinds.get(n.uuid) || "other", label: shorten(n.name, 32) });
    }
    // One line per pair of entities carries every fact between them, so parallel facts don't
    // pile up. A line without an arrowhead has facts pointing both ways.
    for (const f of facts) {
      if (!g.hasNode(f.source) || !g.hasNode(f.target)) continue;
      const key = [f.source, f.target].sort().join("|");
      if (!g.hasEdge(key)) g.addDirectedEdgeWithKey(key, f.source, f.target, { facts: [], type: "arrow" });
      g.getEdgeAttribute(key, "facts").push(f);
      if (g.source(key) !== f.source) g.setEdgeAttribute(key, "type", "line");
    }
    g.forEachEdge((key, a) => {
      const names = [...new Set(a.facts.map((f) => f.name))];
      g.mergeEdgeAttributes(key, {
        names, current: a.facts.some((f) => f.current),
        label: a.facts.length > 1 ? `${names[0]} +${a.facts.length - 1}` : names[0],
      });
    });
    g.forEachNode((id) => {
      let count = 0;
      g.forEachEdge(id, (_, a) => { count += a.facts.length; });
      g.mergeNodeAttributes(id, { facts: count, size: Math.min(22, 3 + 2.4 * Math.sqrt(count)) });
    });
    return g;
  }

  function layout(g) {
    // Placed nodes stay put; new ones start next to a placed neighbour, or on a spiral when
    // nothing is placed yet. Seeding by sorted id keeps the same data in the same picture.
    const fresh = g.nodes().filter((id) => !positions.has(id)).sort();
    for (const id of g.nodes()) if (positions.has(id)) g.mergeNodeAttributes(id, { ...positions.get(id), fixed: true });
    fresh.forEach((id, i) => {
      const anchor = g.neighbors(id).find((n) => positions.has(n));
      const angle = i * 2.399963;
      const [cx, cy, r] = anchor ? [positions.get(anchor).x, positions.get(anchor).y, 5] : [0, 0, 10 * Math.sqrt(i + 1)];
      g.mergeNodeAttributes(id, { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    });
    if (fresh.length) {
      // LinLog with hubs pushed outward and node sizes respected keeps leaves from piling onto
      // their hub. Sizes only count without Barnes-Hut, and its cost grows with the square of the
      // node count, so big graphs get fewer iterations and then the approximation.
      const barnesHut = g.order > 1000;
      const settings = {
        ...forceAtlas2.inferSettings(g), barnesHutOptimize: barnesHut, adjustSizes: !barnesHut,
        linLogMode: true, outboundAttractionDistribution: true,
      };
      const iterations = Math.round(Math.max(100, Math.min(500, 4e7 / g.order ** 2)));
      forceAtlas2.assign(g, { iterations: fresh.length === g.order ? iterations : 150, settings });
    }
    g.forEachNode((id, a) => { g.removeNodeAttribute(id, "fixed"); positions.set(id, { x: a.x, y: a.y }); });
  }

  function paint() {
    readColors();
    graph.forEachNode((id, a) => graph.setNodeAttribute(id, "color", kindColor(a.kind)));
    graph.forEachEdge((key, a) => graph.mergeEdgeAttributes(key, { color: a.current ? colors.edge : colors.edgeHistory, size: a.current ? 1.5 : 1 }));
  }

  function rebuild() {
    const data = state.data;
    const notice = document.getElementById("notice");
    const current = data.edges.filter((e) => e.current).length;
    document.getElementById("meta").textContent =
      `${data.nodes.length} entities · ${current} current facts · ${data.edges.length - current} historical`;

    graph = buildGraph(data);
    layout(graph);
    paint();
    // The reducers run as soon as sigma gets the new graph, so drop anything it no longer has.
    const sel = state.selected;
    if (sel && !(sel.type === "node" ? graph.hasNode(sel.id) : graph.hasEdge(sel.id))) state.selected = null;
    state.hovered = state.hoveredEdge = null;
    neighbourhood = null;
    if (state.focus && !graph.hasNode(state.focus)) state.focus = null;
    focusSet = state.focus ? new Set([state.focus, ...graph.neighbors(state.focus)]) : null;
    setRelFilter(state.relFilter);

    if (data.error || !data.enabled || !graph.order) {
      notice.hidden = false;
      notice.textContent = data.error ? `Graph unavailable: ${data.error}`
        : !data.enabled ? "Graphiti is disabled (MEMORY_GRAPH_ENABLED=false)."
        : "No facts yet. Add memories and they will appear here.";
    } else {
      notice.hidden = true;
    }

    if (renderer) renderer.setGraph(graph);
    else renderer = createRenderer();

    document.getElementById("entity-names").innerHTML = graph.nodes()
      .sort((a, b) => graph.getNodeAttribute(b, "facts") - graph.getNodeAttribute(a, "facts"))
      .map((id) => `<option value="${esc(graph.getNodeAttribute(id, "name"))}">`).join("");
    renderOverview();
    select(state.selected);
  }

  function createRenderer() {
    const r = new Sigma(graph, container, {
      allowInvalidContainer: true,
      enableEdgeEvents: true,
      renderEdgeLabels: true,
      zIndex: true,
      defaultEdgeType: "arrow",
      labelFont: LABEL_FONT, labelSize: 12, labelWeight: "500",
      edgeLabelFont: MONO_FONT, edgeLabelSize: 10, edgeLabelColor: { color: colors.textSecondary },
      labelDensity: 0.6, labelGridCellSize: 120, labelRenderedSizeThreshold: 7,
      minCameraRatio: 0.03, maxCameraRatio: 3,
      stagePadding: 40,
      defaultDrawNodeLabel: drawLabel,
      defaultDrawNodeHover: drawHover,
      nodeReducer, edgeReducer,
    });
    r.on("enterNode", ({ node }) => { state.hovered = node; container.style.cursor = "pointer"; highlight(); });
    r.on("leaveNode", () => { state.hovered = null; container.style.cursor = ""; highlight(); });
    r.on("enterEdge", ({ edge }) => { state.hoveredEdge = edge; container.style.cursor = "pointer"; highlight(); });
    r.on("leaveEdge", () => { state.hoveredEdge = null; container.style.cursor = ""; highlight(); });
    r.on("clickNode", ({ node }) => select({ type: "node", id: node }));
    r.on("clickEdge", ({ edge }) => select({ type: "edge", id: edge }));
    r.on("clickStage", () => select(null));
    r.on("doubleClickNode", ({ node, preventSigmaDefault }) => { preventSigmaDefault(); setFocus(state.focus === node ? null : node); });

    // Drag a node to move it; it stays where it is dropped.
    let dragged = null;
    r.on("downNode", ({ node }) => {
      dragged = node;
      if (!r.getCustomBBox()) r.setCustomBBox(r.getBBox());
    });
    r.on("moveBody", ({ event, preventSigmaDefault }) => {
      if (!dragged) return;
      const pos = r.viewportToGraph(event);
      graph.mergeNodeAttributes(dragged, { x: pos.x, y: pos.y });
      positions.set(dragged, pos);
      preventSigmaDefault();
      event.original.preventDefault();
      event.original.stopPropagation();
    });
    const drop = () => { dragged = null; };
    r.on("upNode", drop);
    r.on("upStage", drop);
    return r;
  }

  function drawLabel(context, data, settings) {
    if (!data.label) return;
    context.font = `${settings.labelWeight} ${settings.labelSize}px ${settings.labelFont}`;
    const x = data.x + data.size + 4, y = data.y + settings.labelSize / 3;
    // A halo in the surface colour keeps labels readable over lines.
    context.lineJoin = "round";
    context.lineWidth = 4;
    context.strokeStyle = colors.surface;
    context.strokeText(data.label, x, y);
    context.fillStyle = colors.text;
    context.fillText(data.label, x, y);
  }

  function drawHover(context, data, settings) {
    context.beginPath();
    context.arc(data.x, data.y, data.size + 3, 0, Math.PI * 2);
    context.lineWidth = 2;
    context.strokeStyle = colors.selection;
    context.stroke();
    drawLabel(context, data, settings);
  }

  const selectedNode = () => (state.selected?.type === "node" ? state.selected.id : null);
  const selectedEdge = () => (state.selected?.type === "edge" ? state.selected.id : null);
  const matchesQuery = (n) => {
    const q = state.query.trim().toLowerCase();
    return !q || graph.getNodeAttribute(n, "name").toLowerCase().includes(q);
  };
  const kindOk = (n) => !state.kindFilter || graph.getNodeAttribute(n, "kind") === state.kindFilter;

  function nodeReducer(node, attrs) {
    const res = { ...attrs };
    if (focusSet && !focusSet.has(node)) return { ...res, hidden: true };
    const edge = selectedEdge();
    let lit;
    if (neighbourhood) lit = neighbourhood.has(node);
    else if (edge) lit = graph.extremities(edge).includes(node);
    else lit = matchesQuery(node) && kindOk(node) && (!relNodes || relNodes.has(node));
    const filtered = state.query.trim().length > 1 || state.kindFilter || relNodes;
    if (!lit) Object.assign(res, { color: colors.dim, label: "", zIndex: 0 });
    else Object.assign(res, { zIndex: 1, forceLabel: Boolean(neighbourhood || edge || focusSet || filtered) });
    if (node === selectedNode()) res.highlighted = true;
    return res;
  }

  function edgeReducer(edge, attrs) {
    const res = { ...attrs, label: "" };
    const [s, t] = graph.extremities(edge);
    if (focusSet && !(focusSet.has(s) && focusSet.has(t))) return { ...res, hidden: true };
    const active = state.hovered || selectedNode();
    let lit, labelled = s === state.focus || t === state.focus;
    if (edge === selectedEdge() || edge === state.hoveredEdge) {
      lit = labelled = true;
      Object.assign(res, { color: colors.selection, size: 2.5 });
    } else if (active) {
      lit = labelled = s === active || t === active;
      if (lit) res.color = colors.textSecondary;
    } else if (selectedEdge()) {
      lit = false;
    } else if (state.relFilter) {
      lit = labelled = attrs.names.includes(state.relFilter);
      if (lit) Object.assign(res, { color: colors.accent, size: 2 });
    } else {
      lit = (matchesQuery(s) || matchesQuery(t)) && (kindOk(s) || kindOk(t));
    }
    if (!lit) Object.assign(res, { color: colors.dim, zIndex: 0 });
    else res.zIndex = 1;
    if (lit && labelled) Object.assign(res, { label: attrs.label, forceLabel: true });
    return res;
  }

  function highlight() {
    const active = state.hovered || selectedNode();
    neighbourhood = active && graph.hasNode(active) ? new Set([active, ...graph.neighbors(active)]) : null;
    renderer.refresh({ skipIndexation: true });
  }

  function setRelFilter(name) {
    state.relFilter = name || null;
    relNodes = null;
    if (state.relFilter) {
      relNodes = new Set();
      graph.forEachEdge((_, a, s, t) => { if (a.names.includes(state.relFilter)) { relNodes.add(s); relNodes.add(t); } });
    }
  }

  function setFocus(node) {
    state.focus = node;
    focusSet = node ? new Set([node, ...graph.neighbors(node)]) : null;
    renderOverview();
    highlight();
    fit();
  }

  // Frames the given nodes, or the whole graph when there are none.
  function fit(nodes = focusSet) {
    const camera = renderer.getCamera();
    if (!nodes) return camera.animatedReset({ duration: 400 });
    const points = [...nodes].map((n) => renderer.getNodeDisplayData(n)).filter(Boolean);
    const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
    camera.animate({
      x: (Math.max(...xs) + Math.min(...xs)) / 2, y: (Math.max(...ys) + Math.min(...ys)) / 2,
      ratio: Math.min(1, Math.max(0.08, span * 1.3)),
    }, { duration: 400 });
  }

  function renderOverview() {
    const el = document.getElementById("overview");
    const kindCounts = countBy(graph.nodes(), (n) => graph.getNodeAttribute(n, "kind"));
    const facts = graph.mapEdges((_, a) => a.facts).flat();
    // Graphiti names most relationships once, so a chip per name would bury the graph.
    const relCounts = countBy(facts, (f) => f.name);
    el.innerHTML = `
      <div class="group"><span class="group-title">Entities</span>
        <span class="chip ${state.kindFilter ? "" : "active"}" data-kind="">* <span class="count">(${graph.order})</span></span>
        ${kindCounts.map(([k, c]) => `<span class="chip ${state.kindFilter === k ? "active" : ""}" data-kind="${esc(k)}"><span class="dot" style="background:${kindColor(k)}"></span>${esc(k)} <span class="count">(${c})</span></span>`).join("")}
      </div>
      <div class="group"><span class="group-title">Relationship</span>
        <select id="rel" aria-label="Highlight a relationship">
          <option value="">All (${facts.length} facts, ${relCounts.length} names)</option>
          ${relCounts.map(([r, c]) => `<option value="${esc(r)}" ${state.relFilter === r ? "selected" : ""}>${esc(r)} (${c})</option>`).join("")}
        </select>
      </div>
      ${state.focus ? `<button id="unfocus">Show whole graph</button>` : ""}`;
    el.querySelectorAll("[data-kind]").forEach((c) => c.addEventListener("click", () => {
      state.kindFilter = c.dataset.kind || null;
      renderOverview();
      highlight();
    }));
    el.querySelector("#rel").addEventListener("change", (ev) => { setRelFilter(ev.target.value); highlight(); });
    el.querySelector("#unfocus")?.addEventListener("click", () => setFocus(null));
  }

  function select(sel, { center = false } = {}) {
    const exists = sel && (sel.type === "node" ? graph.hasNode(sel.id) : graph.hasEdge(sel.id));
    state.selected = exists ? sel : null;
    renderInspector();
    highlight();
    const node = selectedNode();
    if (center && node) fit(new Set([node, ...graph.neighbors(node)]));
  }

  function renderInspector() {
    const el = document.getElementById("inspector");
    const rows = (pairs) => `<table>${pairs.map(([k, v]) => `<tr><td class="key">${esc(k)}</td><td class="value">${v}</td></tr>`).join("")}</table>`;
    const name = (id) => esc(graph.getNodeAttribute(id, "name"));
    const goto = (id) => `<button class="goto" data-goto="${esc(id)}">${name(id)}</button>`;
    const hint = `<p class="hint">Hover a node to see its connections. Click a node or line to inspect it. <kbd>Double-click</kbd> a node to show only its neighbours. Drag nodes to move them.</p>`;
    const sel = state.selected;
    if (!sel) {
      el.innerHTML = `<h2>Overview</h2><p class="empty">Nothing selected.</p>${hint}`;
    } else if (sel.type === "node") {
      const n = graph.getNodeAttributes(sel.id);
      const facts = [];
      graph.forEachEdge(sel.id, (_, a) => facts.push(...a.facts));
      el.innerHTML = `<h2><span class="chip"><span class="dot" style="background:${kindColor(n.kind)}"></span>${esc(n.kind)}</span>${esc(n.name)}</h2>` +
        rows([["summary", n.summary ? `<span class="clamp" title="Click to expand">${esc(n.summary)}</span>` : "—"], ["uuid", `<code>${esc(sel.id)}</code>`],
              [`facts (${facts.length})`, facts.map((f) => `<span class="source">${f.source === sel.id ? "→" : "←"} <code>${esc(f.name)}</code> ${goto(f.source === sel.id ? f.target : f.source)}${f.current ? "" : '<span class="badge">historical</span>'}</span>`).join("") || "—"]]) + hint;
    } else {
      const [s, t] = graph.extremities(sel.id);
      const facts = graph.getEdgeAttribute(sel.id, "facts");
      const factHtml = (f) => {
        const sources = f.source_memory_ids.map((id) => {
          const m = state.data.memories[id];
          if (!m) return `<span class="source"><code>${esc(id)}</code> (missing)</span>`;
          return `<span class="source">${esc(m.title)} <span class="badge">${esc(m.type)}</span>${m.verified_by_user ? '<span class="badge">verified</span>' : ""}${m.status === "superseded" ? '<span class="badge">superseded</span>' : ""}<br><code>${esc(m.path)}</code></span>`;
        }).join("");
        return `<h3><span class="chip rel">${esc(f.name)}</span>${f.current ? "" : '<span class="badge">historical</span>'}</h3>` +
          rows([["from", goto(f.source)], ["to", goto(f.target)], ["fact", esc(f.fact)], ["valid_at", fmtDate(f.valid_at)],
                ["invalid_at", fmtDate(f.invalid_at)], ["sources", sources || "—"], ["uuid", `<code>${esc(f.uuid)}</code>`]]);
      };
      el.innerHTML = `<h2>${goto(s)} ↔ ${goto(t)}<span class="badge">${facts.length} ${facts.length === 1 ? "fact" : "facts"}</span></h2>` +
        facts.map(factHtml).join("") + hint;
    }
    el.querySelectorAll("[data-goto]").forEach((b) => b.addEventListener("click", () => select({ type: "node", id: b.dataset.goto }, { center: true })));
    el.querySelector(".clamp")?.addEventListener("click", (ev) => ev.currentTarget.classList.remove("clamp"));
  }

  function findNode(query) {
    const q = query.trim().toLowerCase();
    if (!q) return null;
    const byFacts = (a, b) => graph.getNodeAttribute(b, "facts") - graph.getNodeAttribute(a, "facts");
    const nodes = graph.nodes().filter((n) => !focusSet || focusSet.has(n)).sort(byFacts);
    const nameOf = (n) => graph.getNodeAttribute(n, "name").toLowerCase();
    return nodes.find((n) => nameOf(n) === q) || nodes.find((n) => nameOf(n).startsWith(q)) || nodes.find((n) => nameOf(n).includes(q)) || null;
  }

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    state.query = search.value;
    const exact = findNode(search.value);
    // Picking a name from the suggestions selects it straight away.
    if (exact && graph.getNodeAttribute(exact, "name") === search.value) select({ type: "node", id: exact }, { center: true });
    else highlight();
  });
  search.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const found = findNode(search.value);
    if (found) select({ type: "node", id: found }, { center: true });
  });
  document.getElementById("history").addEventListener("change", (ev) => { state.showHistory = ev.target.checked; rebuild(); });
  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("zoom-in").addEventListener("click", () => renderer.getCamera().animatedZoom({ duration: 300 }));
  document.getElementById("zoom-out").addEventListener("click", () => renderer.getCamera().animatedUnzoom({ duration: 300 }));
  document.getElementById("zoom-fit").addEventListener("click", () => fit());
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    state.kindFilter = null;
    setRelFilter(null);
    setFocus(null);
    select(null);
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!graph) return;
    paint();
    renderer.setSetting("edgeLabelColor", { color: colors.textSecondary });
    renderOverview();
    renderInspector();
  });

  load().catch((err) => { document.getElementById("meta").textContent = `Failed to load: ${err}`; });
</script>
</body>
</html>
